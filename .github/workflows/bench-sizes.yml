name: Bytecode Size Benchmark

on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts (release profile)
        run: FOUNDRY_PROFILE=release forge build --sizes > build-output.txt 2>&1

      - name: Extract UltraVaultV2 size
        id: current_size
        shell: bash
        run: |
          SIZE=$(grep -E '^\|\s*UltraVaultV2\s*\|' build-output.txt | head -n1 | awk -F '|' '{print $3}' | tr -d ', ' | xargs)
          if [[ -z "$SIZE" ]]; then
            echo "Failed to parse UltraVaultV2 size from forge output:"
            cat build-output.txt
            exit 1
          fi
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Current UltraVaultV2 size: $SIZE bytes"
          rm build-output.txt

      - name: Fetch target branch benchmark
        id: base_bench
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:benches/sizes" > /dev/null 2>&1; then
            CONTENT=$(git show "origin/${{ github.base_ref }}:benches/sizes")
            # Preferred new format: key=value lines, extract UltraVaultV2
            if echo "$CONTENT" | grep -qE '^UltraVaultV2='; then
              BASE_SIZE=$(echo "$CONTENT" | awk -F'=' '/^UltraVaultV2=/{print $2}' | tr -d '[:space:]')
            # Backward-compat: legacy file with just a number
            elif echo "$CONTENT" | grep -qE '^[[:space:]]*[0-9]+[[:space:]]*$'; then
              BASE_SIZE=$(echo "$CONTENT" | tr -d '[:space:]')
            else
              echo "Found benches/sizes but could not parse UltraVaultV2 entry."
              echo "Content was:"
              echo "$CONTENT"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "size=$BASE_SIZE" >> "$GITHUB_OUTPUT"
            echo "Found base size: $BASE_SIZE bytes"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No previous benchmark found"
          fi

      - name: Calculate comparison
        id: compare
        shell: bash
        run: |
          CURRENT=${{ steps.current_size.outputs.size }}
          LIMIT=24576
          MARGIN=$((LIMIT - CURRENT))
          MARGIN_PCT=$(awk "BEGIN {printf \"%.2f\", (($MARGIN / $LIMIT) * 100)}")
          
          # Determine status
          if [ "$CURRENT" -gt "$LIMIT" ]; then
            STATUS="🔴 EXCEEDS LIMIT"
          elif [ "$MARGIN" -lt 500 ]; then
            STATUS="⚠️ CRITICAL"
          elif [ "$MARGIN" -lt 2000 ]; then
            STATUS="⚠️ WARNING"
          else
            STATUS="✅ HEALTHY"
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "margin=$MARGIN" >> "$GITHUB_OUTPUT"
          echo "margin_pct=$MARGIN_PCT" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.base_bench.outputs.exists }}" = "true" ]; then
            BASE=${{ steps.base_bench.outputs.size }}
            DIFF=$((CURRENT - BASE))
            
            if [ "$DIFF" -gt 0 ]; then
              CHANGE_EMOJI="📈"
              SIGN="+"
            elif [ "$DIFF" -lt 0 ]; then
              CHANGE_EMOJI="📉"
              SIGN=""
            else
              CHANGE_EMOJI="➡️"
              SIGN=""
            fi
            
            if [ "$BASE" -gt 0 ]; then
              PERCENT=$(awk "BEGIN {printf \"%.2f\", (($DIFF / $BASE) * 100)}")
            else
              PERCENT="0.00"
            fi
            echo "has_comparison=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE"          >> "$GITHUB_OUTPUT"
            echo "diff=$DIFF"          >> "$GITHUB_OUTPUT"
            echo "sign=$SIGN"          >> "$GITHUB_OUTPUT"
            echo "percent=$PERCENT"    >> "$GITHUB_OUTPUT"
            echo "change_emoji=$CHANGE_EMOJI" >> "$GITHUB_OUTPUT"
          else
            echo "has_comparison=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.compare.outputs.current }}';
            const margin = '${{ steps.compare.outputs.margin }}';
            const marginPct = '${{ steps.compare.outputs.margin_pct }}';
            const status = '${{ steps.compare.outputs.status }}';
            const hasComparison = '${{ steps.compare.outputs.has_comparison }}' === 'true';

            let body = '## 📊 UltraVaultV2 Bytecode Size\n\n';

            if (hasComparison) {
              const base = '${{ steps.compare.outputs.base }}';
              const diff = '${{ steps.compare.outputs.diff }}';
              const sign = '${{ steps.compare.outputs.sign }}';
              const percent = '${{ steps.compare.outputs.percent }}';
              const emoji = '${{ steps.compare.outputs.change_emoji }}';
              body += '| Metric | Value |\n';
              body += '|--------|-------|\n';
              body += `| **Current Size** | ${current} bytes |\n`;
              body += `| **Previous Size** | ${base} bytes |\n`;
              body += `| **Change** | ${emoji} ${sign}${diff} bytes (${sign}${percent}%) |\n`;
              body += `| **EVM Limit** | 24576 bytes |\n`;
              body += `| **Margin** | ${margin} bytes (${marginPct}%) |\n`;
              body += `| **Status** | ${status} |\n`;
            } else {
              body += '**Initial benchmark - no previous data to compare.**\n\n';
              body += '| Metric | Value |\n';
              body += '|--------|-------|\n';
              body += `| **Size** | ${current} bytes |\n`;
              body += `| **EVM Limit** | 24576 bytes |\n`;
              body += `| **Margin** | ${margin} bytes (${marginPct}%) |\n`;
              body += `| **Status** | ${status} |\n`;
            }

            body += '\n---\n*This comment is automatically updated on each push.*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('📊 UltraVaultV2 Bytecode Size')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Update benchmark file
        run: |
          mkdir -p benches
          printf "UltraVaultV2=%s\n" "${{ steps.current_size.outputs.size }}" > benches/sizes

      # Only commit back when the PR is from the same repository (not a fork),
      # and avoid looping when the actor is the bot.
      - name: Commit benchmark update
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we are on the PR head branch (safety belt)
          git checkout "${{ github.head_ref }}"

          git add benches/sizes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bytecode size benchmark"
            # Push explicitly to the PR branch to avoid detached HEAD issues
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Check size limit
        run: |
          CURRENT=${{ steps.compare.outputs.current }}
          if [ "$CURRENT" -gt 24576 ]; then
            echo "❌ ERROR: UltraVaultV2 bytecode size ($CURRENT bytes) exceeds the EVM limit (24576 bytes)!"
            exit 1
          fi
